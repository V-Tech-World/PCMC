<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2F6142" />
    <title>VoiceCare LK — Staff Dashboard</title>
    <script>
      // Apply the saved theme BEFORE first paint (default = light, per spec).
      try {
        if (localStorage.getItem("voicecare-theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {
        /* storage unavailable: stay light */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
